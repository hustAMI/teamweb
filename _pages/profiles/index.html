<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <div class="lab-members-page"> </div> <style>.lab-members-page{margin-top:1.5rem}.lab-section{margin-bottom:2.2rem}.lab-section-title{font-size:1rem;font-weight:700;color:#006eb8;border-top:1px dashed #cfcfcf;padding-top:.75rem;margin-bottom:1rem}.lab-grid{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:1rem}.lab-grid-one{grid-template-columns:minmax(260px,330px)}.lab-card{position:relative;display:grid;grid-template-columns:105px 1fr;column-gap:.75rem;min-height:150px;padding:.75rem;background:var(--global-card-bg-color);border:1px solid var(--global-divider-color);border-radius:.25rem;box-shadow:0 3px 8px rgba(0,0,0,0.12)}.lab-photo-box img{width:95px;height:120px;object-fit:cover;border-top:1px solid #e0e0e0}.lab-info{text-align:center;padding-top:.25rem;padding-right:.25rem}.lab-name-cn{font-size:1rem;font-weight:700;color:#111}.lab-name-en{font-size:.8rem;font-weight:600;color:#111;margin-top:.15rem}.lab-divider{width:100%;height:0;border-top:3px solid var(--global-divider-color);background:0;margin:.75rem 0 .65rem}.lab-role{font-size:.85rem;color:#333}.lab-note{font-size:.78rem;color:#333;margin-top:.25rem;line-height:1.35}.lab-email{position:absolute;left:.55rem;bottom:.35rem;font-size:.75rem;color:#2c5e8b;text-decoration:none}.lab-more{position:absolute;right:.55rem;bottom:.45rem;width:20px;height:20px;line-height:17px;text-align:center;border-radius:5px;background:linear-gradient(#3da1d9,#1c6095);color:#fff!important;font-size:1.25rem;font-weight:700;text-decoration:none}.lab-more:hover{filter:brightness(1.1);text-decoration:none}html[data-theme="dark"] .lab-card{background:var(--global-card-bg-color);border-color:var(--global-divider-color);box-shadow:0 3px 8px rgba(0,0,0,0.35)}html[data-theme="dark"] .lab-name-cn,html[data-theme="dark"] .lab-name-en,html[data-theme="dark"] .lab-role,html[data-theme="dark"] .lab-note{color:#eee}@media(max-width:900px){.lab-grid{grid-template-columns:repeat(2,minmax(230px,1fr))}}@media(max-width:600px){.lab-grid,.lab-grid-one{grid-template-columns:1fr}.lab-card{grid-template-columns:95px 1fr}.lab-photo-box img{width:85px;height:110px}}.lab-section-summary{cursor:pointer;list-style:none;user-select:none;position:relative;padding-left:1.2rem}.lab-section-summary::-webkit-details-marker{display:none}.lab-section-summary::before{content:"▶";position:absolute;left:0;top:.75rem;font-size:.75rem;color:#006eb8}.lab-collapsible-section[open] .lab-section-summary::before{content:"▼"}.lab-collapsible-section:not([open]){margin-bottom:2.2rem}.lab-collapsible-section:not([open]) .lab-section-summary{margin-bottom:0}.lab-collapsible-section[open] .lab-grid{margin-top:1rem}</style> </body></html>
